name: Jules task
description: A small, well-scoped task for Google Jules
title: "[jules] "
labels: ["jules"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `jules` label on this issue to hand it to Jules. One task per
        issue. `AGENTS.md` gives Jules the repository rules; `docs/JULES.md`
        explains what makes a task work and how to review the result.
  - type: textarea
    id: task
    attributes:
      label: What to change
      description: One concern, with the files named.
      placeholder: |
        Add a test to tests/test_fileio.py that verifies write_text emits LF
        even when the input string contains CRLF.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: What must not change.
      placeholder: |
        Do not modify any file under src/.
        Keep the existing exit codes.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that must pass before the pull request is opened.
      placeholder: |
        python -m pytest
        python scripts/check_docs.py
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: Links, error output, or why this matters.
    validations:
      required: false
