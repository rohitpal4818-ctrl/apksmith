[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apksmith"
# Single source of truth: apksmith/__init__.py. A literal here drifted once
# (pyproject said 0.1.0 while the CLI printed 0.2.0), and the file nobody looks
# at is the one that ends up on PyPI.
dynamic = ["version"]
description = "Static analysis and behaviour extraction from Android APKs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit" }]
keywords = ["android", "apk", "reverse-engineering", "static-analysis", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "androguard>=4.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# ruff is in the dev extras, not installed by CI separately: CONTRIBUTING
# tells contributors that `pip install -e ".[dev]"` is all they need.
# The `mcp` extra exists because the MCP SDK is optional at run time: the CLI
# imports it lazily, so `apksmith scan` works without it. `_require_mcp`'s
# error message points at this extra, and a test asserts it is declared.
# Pinned below 2.0 on purpose: mcp 2.x renamed FastMCP to MCPServer and changed
# the tool-registration API. Widening this without porting the server would
# make `apksmith mcp` fail with an import error on a correct installation.
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mcp>=1.0,<2"]

[project.scripts]
apksmith = "apksmith.cli:main"

[project.urls]
Homepage = "https://github.com/rohitpal4818-ctrl/apksmith"
Repository = "https://github.com/rohitpal4818-ctrl/apksmith"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "apksmith.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"